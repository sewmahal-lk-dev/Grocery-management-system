<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | EverGreen Intelligence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">

    <div class="d-flex">
        <!-- Reusable Left Sidebar (as used in Dashboard) -->
        <div class="glass-sidebar-left p-4" style="width: 280px; height: 100vh; border-right: 1px solid rgba(255,255,255,0.1);">
             <div class="mb-5">
                <span class="logo-text">Ever<span class="text-accent">Green</span></span>
                <p class="tagline">Admin Suite</p>
            </div>
            <nav class="nav flex-column gap-2">
                <a href="admin-dashboard.html" class="nav-link-glass"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a href="admin-inventory.html" class="nav-link-glass active"><i class="bi bi-box-seam"></i> Inventory</a>
                <a href="admin-products.html" class="nav-link-glass"><i class="bi bi-journal-plus"></i> Manage Products</a>
                <a href="admin-orders.html" class="nav-link-glass"><i class="bi bi-cart-check"></i> Orders</a>
                <a href="admin-customers.html" class="nav-link-glass"><i class="bi bi-people"></i> Customers</a>
                <a href="admin-logistics.html" class="nav-link-glass"><i class="bi bi-truck"></i> Logistics</a>
                <a href="admin-payments.html" class="nav-link-glass"><i class="bi bi-credit-card"></i> Payments</a>
                <a href="login.html" class="nav-link-glass text-danger mt-5"><i class="bi bi-box-arrow-left"></i> Logout</a>
            </nav>
        </div>

        <main class="flex-grow-1 p-5">
            <header class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 class="section-headline">Inventory Hub</h2>
                    <p class="section-subheadline">Manage stock reconciliation and weight-based pricing logic</p>
                </div>
                <button class="btn-evergreen-pill" data-bs-toggle="modal" data-bs-target="#addProductModal">
                    <i class="bi bi-plus-lg me-2"></i> New Product
                </button>
            </header>

            <!-- Inventory Search & Filter Bar -->
            <div class="glass-card mb-4 p-3">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="search-container">
                            <i class="bi bi-search search-icon"></i>
                            <input type="text" id="searchInput" class="form-control search-input" placeholder="Search by product name or SKU..." oninput="applyFilters()">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select id="categorySelect" class="form-select auth-input" onchange="applyFilters()">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                    <div class="col-md-3 text-end">
                        <button class="btn-glass-pill w-100 h-100" onclick="loadProducts()">Refresh Data</button>
                    </div>
                </div>
            </div>

            <!-- Inventory Table -->
            <div class="glass-card">
                <div class="table-responsive">
                    <table class="table table-dark align-middle">
                        <thead>
                            <tr class="opacity-50 x-small text-uppercase">
                                <th>Product Details</th>
                                <th>Category</th>
                                <th>Pricing Mode</th>
                                <th>Current Stock</th>
                                <th>Reorder Level</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody">
                            <!-- Dynamically Loaded -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Client-side Guard: Only allow logged-in Admins to access this panel
        const userJson = localStorage.getItem('loggedInUser');
        if (!userJson) {
            alert("Access Denied! Please sign in first.");
            window.location.href = '../login.html';
        } else {
            const user = JSON.parse(userJson);
            if (user.role !== 'ADMIN') {
                alert("Access Denied! You do not have administrator privileges.");
                window.location.href = '../index.html';
            }
        }

        // Dynamic Inventory Logic
        let allProducts = [];
        let allCategories = [];

        document.addEventListener("DOMContentLoaded", () => {
            loadCategories();
            loadProducts();
        });

        function loadCategories() {
            fetch("/api/categories")
                .then(res => res.json())
                .then(categories => {
                    allCategories = categories;
                    const select = document.getElementById("categorySelect");
                    select.innerHTML = '<option value="">All Categories</option>';
                    categories.forEach(cat => {
                        select.innerHTML += `<option value="${cat.id}">${escapeHtml(cat.name)}</option>`;
                    });
                })
                .catch(err => console.error("Error loading categories:", err));
        }

        function loadProducts() {
            const tbody = document.getElementById("inventoryTableBody");
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4"><span class="spinner-border spinner-border-sm text-accent me-2"></span>Loading inventory...</td></tr>`;

            fetch("/api/products")
                .then(res => {
                    if (!res.ok) throw new Error("Failed to load products");
                    return res.json();
                })
                .then(products => {
                    allProducts = products;
                    applyFilters();
                })
                .catch(err => {
                    console.error(err);
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">Error loading inventory: ${err.message}</td></tr>`;
                });
        }

        function renderTable(products) {
            const tbody = document.getElementById("inventoryTableBody");
            tbody.innerHTML = "";

            if (products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 opacity-50">No products found.</td></tr>`;
                return;
            }

            products.forEach(p => {
                const isWeight = p.pricingMode === 'WEIGHT_BASED_KG';
                const unitLabel = isWeight ? 'kg' : 'Units';
                const priceModeLabel = isWeight ? 'Per kg' : 'Per Unit';

                const isLowStock = p.stockQuantity < 20;
                const stockTextClass = isLowStock ? 'text-danger' : 'text-accent';
                const progressClass = isLowStock ? 'bg-danger' : 'bg-accent';

                const maxRef = 200;
                const pct = Math.min(100, Math.max(0, (p.stockQuantity / maxRef) * 100));

                const reorderLabel = isWeight ? '20.0 kg' : '20 Units';

                const imgHtml = p.imageUrl ? 
                    `<img src="${p.imageUrl}" class="item-thumb rounded-3" style="width: 40px; height: 40px; object-fit: cover;">` :
                    `<div class="item-thumb rounded-3 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px; font-size: 0.75rem; background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.3);">IMG</div>`;

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>
                        <div class="d-flex align-items-center gap-3">
                            ${imgHtml}
                            <div>
                                <div class="fw-bold">${escapeHtml(p.name)}</div>
                                <div class="x-small opacity-50">SKU: ${escapeHtml(p.sku || 'N/A')}</div>
                            </div>
                        </div>
                    </td>
                    <td><span class="category-pill">${escapeHtml(p.category ? p.category.name : 'Uncategorized')}</span></td>
                    <td><span class="badge border border-white-10">${priceModeLabel}</span></td>
                    <td>
                        <div class="fw-bold ${stockTextClass}">${p.stockQuantity} ${unitLabel}</div>
                        <div class="progress mt-1" style="height: 4px; background: rgba(255,255,255,0.1);">
                            <div class="progress-bar ${progressClass}" style="width: ${pct}%"></div>
                        </div>
                    </td>
                    <td>${reorderLabel}</td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <input type="number" class="form-control auth-input py-1 px-2" style="width: 80px; font-size: 0.85rem; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.15);" value="${p.stockQuantity}" id="stock-input-${p.id}">
                            <button class="btn-add-cart py-1 px-2" onclick="adjustStock(${p.id})"><i class="bi bi-floppy"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function applyFilters() {
            const searchQuery = document.getElementById("searchInput").value.toLowerCase();
            const categoryId = document.getElementById("categorySelect").value;

            const filtered = allProducts.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(searchQuery) || (p.sku && p.sku.toLowerCase().includes(searchQuery));
                const matchesCategory = !categoryId || (p.category && p.category.id.toString() === categoryId);
                return matchesSearch && matchesCategory;
            });

            renderTable(filtered);
        }

        function adjustStock(productId) {
            const input = document.getElementById(`stock-input-${productId}`);
            const newStock = parseInt(input.value, 10);
            if (isNaN(newStock) || newStock < 0) {
                alert("Please enter a valid stock quantity (0 or positive).");
                return;
            }

            fetch(`/api/admin/products/${productId}/stock`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ stock: newStock })
            })
            .then(res => {
                if (!res.ok) throw new Error("Failed to adjust stock level");
                return res.json();
            })
            .then(updatedProduct => {
                // Update allProducts locally
                const index = allProducts.findIndex(p => p.id === productId);
                if (index !== -1) {
                    allProducts[index].stockQuantity = updatedProduct.stockQuantity;
                }
                applyFilters(); // Re-render table
            })
            .catch(err => {
                alert("Error updating stock quantity: " + err.message);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
