<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EverGreen | Payment Methods</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-black text-white">
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex flex-column" href="index.html">
                <span class="logo-text">Ever<span class="text-accent">Green</span></span>
            </a>
            <div class="d-flex gap-3">
                <a href="index.html" class="btn btn-glass-pill btn-sm">Back to Shop</a>
            </div>
        </div>
    </nav>

    <div class="container profile-container mt-4">
        <div class="row align-items-start">
            
            <!-- Reused Sidebar -->
            <div class="col-lg-3">
                <div class="glass-card p-4">
                    <div class="text-center mb-4">
                        <div class="profile-avatar-lg mb-3">
                            <i class="bi bi-person-circle"></i>
                        </div>
                        <h5 id="userNameDisplay" class="fw-bold mb-1">User Name</h5>
                        <p id="userBioDisplay" class="small opacity-50">User Bio</p>
                    </div>

                    <div class="profile-nav d-flex flex-column gap-2">
                        <a href="profile.html" class="nav-link-glass"><i class="bi bi-person"></i> Personal Info</a>
                        <a href="orders.html" class="nav-link-glass"><i class="bi bi-box-seam"></i> Order History</a>
                        <a href="addresses.html" class="nav-link-glass"><i class="bi bi-geo-alt"></i> Saved Addresses</a>
                        <a href="payments.html" class="nav-link-glass active"><i class="bi bi-credit-card"></i> Payment Methods</a>
                        <hr class="luxury-divider">
                        <a href="javascript:void(0)" onclick="logout()" class="nav-link-glass text-danger"><i class="bi bi-box-arrow-left"></i> Logout</a>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold mb-0">Payment Methods</h4>
                    <button class="btn btn-glass-pill btn-sm" data-bs-toggle="modal" data-bs-target="#addCardModal">
                        <i class="bi bi-plus-lg me-2"></i>Add New Card
                    </button>
                </div>

                <div id="cardList" class="row g-4">
                    <!-- Cards injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add Card Modal -->
    <div class="modal fade" id="addCardModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0">
                <div class="modal-header border-bottom border-white-10 p-4">
                    <h5 class="modal-title fw-bold">Add Payment Method</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="paymentForm">
                        <div class="mb-3">
                            <label class="small text-white-50 mb-2">Cardholder Name</label>
                            <input type="text" id="cardHolderName" class="form-control glass-input" placeholder="e.g. NETHMI AMASHA" required>
                        </div>
                        <div class="mb-3">
                            <label class="small text-white-50 mb-2">Card Number</label>
                            <input type="text" id="cardNumber" class="form-control glass-input" placeholder="0000 0000 0000 0000" maxlength="19" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="small text-white-50 mb-2">Expiry Date</label>
                                <input type="text" id="expiryDate" class="form-control glass-input" placeholder="MM/YY" maxlength="5" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="small text-white-50 mb-2">CVV</label>
                                <input type="password" id="cvv" class="form-control glass-input" placeholder="***" maxlength="3" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-glass-pill w-100 mt-3 py-2">Save Card</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUser = null;
        let cardModal = null;

        document.addEventListener('DOMContentLoaded', function() {
            const userJson = localStorage.getItem('loggedInUser');
            if (userJson) {
                currentUser = JSON.parse(userJson);
                document.getElementById('userNameDisplay').innerText = currentUser.name;
                document.getElementById('userBioDisplay').innerText = currentUser.bio || 'EverGreen Member';
                fetchCards();
            } else {
                window.location.href = 'login.html';
            }
            cardModal = new bootstrap.Modal(document.getElementById('addCardModal'));
        });

        async function fetchCards() {
            try {
                const response = await fetch(`/api/payments/user/${currentUser.id}`);
                const cards = await response.json();
                renderCards(cards);
            } catch (error) {
                console.error('Error fetching cards:', error);
            }
        }

        function renderCards(cards) {
            const container = document.getElementById('cardList');
            container.innerHTML = '';

            if (cards.length === 0) {
                container.innerHTML = '<div class="col-12 text-center opacity-50 p-5">No saved payment methods found.</div>';
                return;
            }

            cards.forEach(card => {
                const gradientClass = card.cardType === 'Visa' ? 'visa-gradient' : 'master-gradient';
                const iconClass = card.cardType === 'Visa' ? 'bi-layers-half' : 'bi-credit-card-2-front';

                container.innerHTML += `
                    <div class="col-md-6">
                        <div class="glass-card p-4 payment-card ${gradientClass}">
                            <div class="d-flex justify-content-between align-items-start mb-4">
                                <div class="d-flex align-items-center gap-2">
                                    <i class="bi ${iconClass} fs-3"></i>
                                    <span class="small fw-bold">${card.cardType}</span>
                                </div>
                                <div class="dropdown">
                                    <button class="btn btn-link text-white p-0 opacity-50" type="button" data-bs-toggle="dropdown">
                                        <i class="bi bi-three-dots-vertical"></i>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-dark dropdown-glass">
                                        <li><a class="dropdown-item small text-danger" href="javascript:void(0)" onclick="deleteCard(${card.id})">Remove Card</a></li>
                                    </ul>
                                </div>
                            </div>
                            <div class="mb-4">
                                <h5 class="mb-1 tracking-widest">${card.maskedCardNumber}</h5>
                                <p class="small opacity-50 text-uppercase">${card.cardHolderName}</p>
                            </div>
                            <div class="d-flex justify-content-between align-items-end">
                                <div>
                                    <p class="x-small opacity-50 mb-0">Expiry Date</p>
                                    <p class="small mb-0">${card.expiryDate}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = {
                userId: currentUser.id,
                cardHolderName: document.getElementById('cardHolderName').value,
                cardNumber: document.getElementById('cardNumber').value,
                expiryDate: document.getElementById('expiryDate').value,
                cvv: document.getElementById('cvv').value
            };

            try {
                const response = await fetch('/api/payments/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    cardModal.hide();
                    document.getElementById('paymentForm').reset();
                    fetchCards();
                } else {
                    alert('Error saving card');
                }
            } catch (error) {
                console.error('Error saving card:', error);
            }
        });

        async function deleteCard(id) {
            if (!confirm('Are you sure you want to remove this card?')) return;
            try {
                const response = await fetch(`/api/payments/delete/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    fetchCards();
                } else {
                    alert('Error removing card');
                }
            } catch (error) {
                console.error('Error removing card:', error);
            }
        }

        function logout() {
            localStorage.removeItem('loggedInUser');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
