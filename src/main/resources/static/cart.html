<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EverGreen | Your Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --accent-color: #2ecc71;
            --glass-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            background: #000;
            color: white;
        }

        .text-accent {
            color: var(--accent-color) !important;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }

        .btn-glass-pill {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: white;
            border-radius: 50px;
            padding: 8px 20px;
            transition: 0.3s;
            text-decoration: none;
        }

        .btn-glass-pill:hover {
            background: var(--accent-color);
            color: black;
        }

        .logo-text {
            font-weight: 800;
            font-size: 1.5rem;
        }

        .product-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top border-bottom border-secondary bg-black">
        <div class="container">
            <a class="navbar-brand d-flex flex-column text-white text-decoration-none" href="#">
                <span class="logo-text">
                    Ever<span class="text-accent">Green</span>
                </span>
            </a>

            <a href="index.html" class="btn btn-glass-pill btn-sm">
                Continue Shopping
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">

        <h4 class="fw-bold mb-4">Shopping Cart</h4>

        <div class="row g-4">

            <!-- Cart Items -->
            <div class="col-lg-8">
                <div id="full-cart-container" class="d-flex flex-column gap-3">
                    <!-- Items load here -->
                </div>
            </div>

            <!-- Order Summary -->
            <div class="col-lg-4">
                <div class="glass-card p-4 sticky-top" style="top: 100px;">

                    <h5 class="fw-bold mb-4">Order Summary</h5>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span id="summary-subtotal">Rs. 0.00</span>
                    </div>

                    <div class="d-flex justify-content-between mb-4">
                        <h6 class="fw-bold">Total</h6>
                        <h6 id="summary-total" class="fw-bold text-accent">
                            Rs. 0.00
                        </h6>
                    </div>

                    <a href="checkout.html" class="btn btn-glass-pill w-100 py-3 fw-bold text-center d-block">
                        Proceed to Checkout
                    </a>

                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', function () {
            const userJson = localStorage.getItem('loggedInUser');
            if (userJson) {
                currentUser = JSON.parse(userJson);
                fetchFullCart();
            } else {
                alert('Please login to view your cart');
                window.location.href = 'login.html';
            }
        });

        // Fetch Cart from Backend
        async function fetchFullCart() {
            if (!currentUser) return;

            try {
                const response = await fetch(`/api/cart/user/${currentUser.id}`);
                const cartItems = await response.json();
                renderFullCart(cartItems);
            } catch (error) {
                console.error('Error fetching cart:', error);
            }
        }

        // Render Cart
        function renderFullCart(cartItems) {
            const container = document.getElementById('full-cart-container');
            container.innerHTML = '';
            let subtotal = 0;

            // Empty Cart
            if (cartItems.length === 0) {
                container.innerHTML = `
                    <div class="text-center p-5 glass-card">
                        <p class="mb-0">Your cart is empty</p>
                    </div>
                `;
                document.getElementById('summary-subtotal').innerText = 'Rs. 0.00';
                document.getElementById('summary-total').innerText = 'Rs. 0.00';
                return;
            }

            // Cart Items
            cartItems.forEach(item => {
                const itemTotal = item.product.price * item.quantity;
                subtotal += itemTotal;

                container.innerHTML += `
                    <div class="glass-card p-3">
                        <div class="d-flex align-items-center gap-4">
                            <img src="${item.product.imageUrl || 'https://via.placeholder.com/150'}" 
                                 class="rounded-3 product-img">
                            <div class="flex-grow-1">
                                <h6 class="fw-bold mb-1">${item.product.name}</h6>
                                <div class="d-flex align-items-center gap-2">
                                    <button 
                                        class="btn btn-sm btn-outline-light rounded-circle p-0"
                                        onclick="updateQty(${item.product.id}, ${item.quantity - 1})"
                                        style="width: 28px; height: 28px;"
                                    >
                                        <i class="bi bi-dash"></i>
                                    </button>
                                    <span class="fw-bold px-2">
                                        ${item.quantity}
                                    </span>
                                    <button 
                                        class="btn btn-sm btn-outline-light rounded-circle p-0"
                                        onclick="updateQty(${item.product.id}, ${item.quantity + 1})"
                                        style="width: 28px; height: 28px;"
                                    >
                                        <i class="bi bi-plus"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="text-end">
                                <h6 class="fw-bold mb-1 text-accent">
                                    Rs. ${itemTotal.toFixed(2)}
                                </h6>
                                <button 
                                    class="btn btn-link btn-sm text-danger p-0 text-decoration-none"
                                    onclick="removeItem(${item.product.id})"
                                >
                                    <i class="bi bi-trash"></i> Remove
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('summary-subtotal').innerText = `Rs. ${subtotal.toFixed(2)}`;
            document.getElementById('summary-total').innerText = `Rs. ${subtotal.toFixed(2)}`;
        }

        // Update Quantity
        async function updateQty(productId, newQuantity) {
            if (!currentUser) return;

            try {
                const response = await fetch('/api/cart/update', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUser.id,
                        productId: productId,
                        quantity: newQuantity
                    })
                });

                if (response.ok) {
                    fetchFullCart();
                } else {
                    alert('Failed to update quantity');
                }
            } catch (error) {
                console.error('Error updating quantity:', error);
            }
        }

        // Remove Item
        async function removeItem(productId) {
            if (!currentUser) return;

            if (!confirm('Are you sure you want to remove this item?')) return;

            try {
                const response = await fetch(`/api/cart/remove?userId=${currentUser.id}&productId=${productId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    fetchFullCart();
                } else {
                    alert('Failed to remove item');
                }
            } catch (error) {
                console.error('Error removing item:', error);
            }
        }
    </script>

</body>

</html>
