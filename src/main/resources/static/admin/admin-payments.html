<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Ledger | EverGreen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="glass-sidebar-left p-4" style="width: 280px; height: 100vh; border-right: 1px solid rgba(255,255,255,0.1);">
            <div class="mb-5">
                <span class="logo-text">Ever<span class="text-accent">Green</span></span>
                <p class="tagline">Admin Suite</p>
            </div>
            <nav class="nav flex-column gap-2">
                <a href="admin-dashboard.html" class="nav-link-glass"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a href="admin-inventory.html" class="nav-link-glass"><i class="bi bi-box-seam"></i> Inventory</a>
                <a href="admin-products.html" class="nav-link-glass"><i class="bi bi-journal-plus"></i> Manage Products</a>
                <a href="admin-orders.html" class="nav-link-glass"><i class="bi bi-cart-check"></i> Orders</a>
                <a href="admin-customers.html" class="nav-link-glass"><i class="bi bi-people"></i> Customers</a>
                <a href="admin-logistics.html" class="nav-link-glass"><i class="bi bi-truck"></i> Logistics</a>
                <a href="admin-payments.html" class="nav-link-glass active"><i class="bi bi-credit-card"></i> Payments</a>
                <a href="login.html" class="nav-link-glass text-danger mt-5"><i class="bi bi-box-arrow-left"></i> Logout</a>
            </nav>
        </div>

        <main class="flex-grow-1 p-5">
            <header class="mb-5">
                <h2 class="section-headline">Transaction History</h2>
                <p class="section-subheadline">Monitoring revenue and weight-adjusted billings</p>
            </header>

            <!-- Revenue Summary -->
            <div class="row g-4 mb-5">
                <div class="col-md-6">
                    <div class="glass-card">
                        <span class="tagline">Monthly Gross Revenue</span>
                        <h2 class="product-price text-accent mt-2" id="monthlyRevenueCard">Rs. 0.00</h2>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="glass-card">
                        <span class="tagline">Refunds/Adjustments</span>
                        <h2 class="product-price text-danger mt-2" id="refundsCard">Rs. 0.00</h2>
                    </div>
                </div>
            </div>

            <!-- Payment Table -->
            <div class="glass-card">
                <table class="table table-dark align-middle">
                    <thead>
                        <tr class="opacity-50 x-small text-uppercase">
                            <th>Transaction ID</th>
                            <th>Customer</th>
                            <th>Amount</th>
                            <th>Method</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="paymentsTableBody">
                        <!-- Dynamically Loaded -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // Client-side Guard: Only allow logged-in Admins to access this panel
        const userJson = localStorage.getItem('loggedInUser');
        if (!userJson) {
            alert("Access Denied! Please sign in first.");
            window.location.href = '../login.html';
        } else {
            const user = JSON.parse(userJson);
            if (user.role !== 'ADMIN') {
                alert("Access Denied! You do not have administrator privileges.");
                window.location.href = '../index.html';
            }
        }

        // Dynamic Financial Ledger Loading
        document.addEventListener("DOMContentLoaded", () => {
            loadPaymentLedger();
        });

        function loadPaymentLedger() {
            const tbody = document.getElementById("paymentsTableBody");
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4"><span class="spinner-border spinner-border-sm text-accent me-2"></span>Loading ledger transactions...</td></tr>`;

            fetch("/api/admin/payments/ledger")
                .then(res => {
                    if (!res.ok) throw new Error("Failed to fetch financial ledger");
                    return res.json();
                })
                .then(ledger => {
                    // Update KPI Cards
                    document.getElementById("monthlyRevenueCard").innerText = `Rs. ${ledger.monthlyRevenue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                    document.getElementById("refundsCard").innerText = `Rs. ${ledger.refunds.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

                    tbody.innerHTML = "";
                    if (ledger.transactions.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 opacity-50">No ledger transaction history found.</td></tr>`;
                        return;
                    }

                    ledger.transactions.forEach(t => {
                        let badgeClass = "border border-white-10";
                        let label = "Verification Pending";

                        // Map order status to payment status
                        if (t.status === "CANCELLED") {
                            badgeClass = "bg-danger-soft";
                            label = "Refunded";
                        } else if (t.status === "DELIVERED" || t.paymentMethod.toLowerCase().includes("card") || t.paymentMethod.toLowerCase().includes("stripe")) {
                              badgeClass = "bg-success-soft";
                              label = "Completed";
                        } else if (t.status === "SHIPPED") {
                              badgeClass = "bg-info-soft text-info";
                              label = "In Transit";
                        }

                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td><span class="fw-bold text-accent">#TRX-${t.id}</span></td>
                            <td>${escapeHtml(t.customerName)}</td>
                            <td>Rs. ${t.amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                            <td>${escapeHtml(t.paymentMethod)}</td>
                            <td>${t.orderDate}</td>
                            <td><span class="badge ${badgeClass}">${label}</span></td>
                        `;
                        tbody.appendChild(row);
                    });
                })
                .catch(err => {
                    console.error("Error loading ledger:", err);
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">Error: ${err.message}</td></tr>`;
                });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
